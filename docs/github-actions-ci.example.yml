name: App checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.sqlite
      SHOPIFY_API_KEY: ci-placeholder
      SHOPIFY_API_SECRET: ci-not-a-real-secret
      SHOPIFY_APP_URL: https://ci.example.com
      WORLD_PROVIDER: mock
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm exec prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
